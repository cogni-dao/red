# Per-node secrets catalog — node-domain (single-node-scope).
#
# Declare the SHAPE of each A2 secret this node's app consumes; NEVER the value.
# `service:` auto-resolves to this node's slug, so each key lands at
# OpenBao `cogni/<env>/<slug>/<KEY>` and fans out ONLY to this node's pod.
#
# The VALUE is written separately — see https://cognidao.org/knowledge/node-self-serve-secrets §3:
#   - self-serve: POST /api/v1/nodes/<id>/secrets  (node-owner, OpenFGA-gated, API key only)
#   - ops:        pnpm secrets:set <env> <slug> <KEY>
#
# This file ships empty. Add entries as your node needs them, e.g.:
#
# secrets:
#   - name: MY_VENDOR_API_KEY
#     tier: A2
#     appliesTo: web
#     shared: false
#     source: human
#     required: true
#     category: "Vendor Name"
#     description: One line describing what consumes this key.
#     steps:
#       - "Create the key in the vendor dashboard."

secrets:
  # Shared execd token for Red's code-execution sandbox. The sandbox enforces it
  # on every execd request; the app presents the same value as X-EXECD-ACCESS-TOKEN
  # (core__sandbox_exec, story.0002). The value already exists in OpenBao; the
  # operator only creates it if absent and never rotates it.
  - name: SANDBOX_EXECD_TOKEN
    tier: A2
    source: agent
    generate: { kind: hex, bytes: 32 }
    workloads: [app, sandbox]
    required: true
    category: "Sandbox"
    description: Shared execd access token the sandbox enforces and the app presents.
    steps: []
