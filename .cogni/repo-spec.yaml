# Node Template — repo-spec
#
# Identity for the hub's node-template deployment; node_id MUST match
# infra/catalog/node-template.yaml. Forks renaming this scaffold MUST
# regenerate both UUIDs:
#   node_id:  openssl rand -hex 16 | sed 's/\(.\{8\}\)\(.\{4\}\)\(.\{4\}\)\(.\{4\}\)\(.\{12\}\)/\1-\2-\3-\4-\5/'
#   scope_id: uuidv5(node_id, "default")
# See docs/spec/identity-model.md, docs/spec/multi-node-tenancy.md.

schema_version: "0.1.4"

node_id: "921b1d1d-4ded-4a6d-b3f1-f7d6affa406a"
scope_id: "a85d240b-26a3-573f-89a3-4b8aa9b8087c"
scope_key: "default"

intent:
  name: red
  hook: "Break it before they do"
  mission: "An AI-powered hacking team, for good — think like an attacker so defenders win. In perpetual war with blue."
  brand:
    icon: "Crosshair"
    color: "#ef4444"

governance:
  dao_contract: "0xd562b1d2d86a666a07bb6ccfdc9189aa4c1701e4"
  plugin_contract: "0x7392896f7ecacdad8309c14080c137980a17c98c"
  signal_contract: "0xdad8ee37919b35ccaf3c5fc7b546ede5304b242f"
  token_contract: "0x2A16291384F9DD78049d1b7a3620B23b137F4540"
  chain_id: "8453"
  base_url: "https://proposal.cognidao.org"

knowledge:
  database: "knowledge_red"
  remote:
    provider: dolthub
    owner: "cogni-dao"
    repo: "red"
    url: "https://doltremoteapi.dolthub.com/cogni-dao/red"
    custody: cogni-owned

# App-tier workload this node runs, in the node's own words: services, ports,
# resources, and exactly one `public` service. This is provider-neutral — the
# parent catalog, not this file, decides whether an environment lands on k3s or
# off-cluster compute.
# The `cogni-node-app-v1` runtime_profile pins the Cogni Next.js app contract;
# the operator supplies that profile's standard secrets automatically, so you only
# add `secret_refs` here for a secret BEYOND the profile.
# Add sibling services here (private by default) as this node grows.
deployment:
  services:
    - name: app
      artifact:
        name: app
        context: .
        dockerfile: Dockerfile
        target: runner
      port: 3200
      visibility: public
      runtime_profile: cogni-node-app-v1
      bindings: {}
      bind_host: 0.0.0.0
      resources:
        cpu_units: 2
        memory_mi: 2048
        storage_mi: 4096

# Activity ledger ingestion + approver allowlist.
# `approvers` gates the `(admin)/` route group and write routes under
# `/api/v1/attribution/*`. Replace with the fork's DAO-owner wallet(s) when
# spinning up a new node from this template.
activity_ledger:
  epoch_length_days: 7
  approvers:
    - "0x070075F1389Ae1182aBac722B36CA12285d0c949" # derekg1729.eth (template default)
  activity_sources:
    github:
      attribution_pipeline: cogni-v0.0
      source_refs: ["cogni-dao/red"]

payments:
  status: pending_activation

# Token distributions — activate after verifying DAO-controlled minted inventory.
distributions:
  status: pending_activation

# Born-reviewable default gates. When this node is minted as a single-node fork
# (node-at-root, no `nodes:` registry) the operator's review path runs these gates
# against the repo-root `.cogni/rules/` below. The mint (`renderRepoSpec`) re-emits
# this same block onto the minted repo's identity spec — keep the two in lockstep.
# Gate set coordinated with the operator review path (Lane A). Tune per node.
gates:
  - type: review-limits
    id: review_limits
    with:
      max_changed_files: 50
      max_total_diff_kb: 1500
  - type: ai-rule
    with:
      rule_file: pr-syntropy-coherence.yaml
  - type: ai-rule
    with:
      rule_file: patterns-and-docs.yaml
  - type: ai-rule
    with:
      rule_file: repo-goal-alignment.yaml
