# Workload manifest (hub `workload-manifest`, story.5137): Red's app on the operator's node-deploy verb.
# `POST /api/v1/deploy/workloads {nodeId, env, workload: "app", sourceSha}` reads this file at sourceSha.
# Image "." = the image this repo's CI built at that sha. Runtime env and secrets come from the operator
# (OpenBao custody), never from this file. The host is the PRODUCTION host; candidate-a and preview get
# the `-test` / `-preview` sibling automatically.
apiVersion: score.dev/v1b1
metadata:
  name: app
  annotations:
    cogni.dev/exclusive: "false"
    cogni.dev/ephemeral-storage: 4Gi
containers:
  app:
    image: .
    variables:
      # Authenticated callers trusted to start a sandbox coding run (union list; the sandbox:exec role still has to be On for the node AI).
      #   dfa8570f-d487-4239-b40a-2e39ee4513f9  ladder-validator (validation caller; holds no live candidate key)
      #   0acd8b06-5408-4c49-a284-c30cb489d92d  flock-leader on production (absent on candidate-a)
      #   b89bbfac-defe-4005-bc2a-28aa2caf6f0f  flock-leader-conductor: the trusted coding caller for candidate validation (live key COGNI_FLOCK_LEADER_RED_CANDIDATE_API_KEY)
      #   eb280790-4acc-4f7c-94af-46096ecbb58b  the CEO's candidate account: the user who approved node-ai's sandbox:exec role (agent_roles.approved_by on cogni_red, candidate-a)
      COGNI_CODING_ACTOR_IDS: "dfa8570f-d487-4239-b40a-2e39ee4513f9,0acd8b06-5408-4c49-a284-c30cb489d92d,b89bbfac-defe-4005-bc2a-28aa2caf6f0f,eb280790-4acc-4f7c-94af-46096ecbb58b"
    resources:
      requests:
        cpu: "2"
        memory: 2048Mi
    readinessProbe:
      httpGet:
        path: /readyz
        port: 3200
service:
  ports:
    web:
      port: 80
      targetPort: 3200
resources:
  web:
    type: route
    params:
      host: red.cognidao.org
      path: /
      port: 80
