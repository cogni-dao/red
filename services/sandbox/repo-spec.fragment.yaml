# Operator handoff proposal; NOT an active deployment declaration.
# Merge into .cogni/repo-spec.yaml only after the operator's exact schema and
# artifact-bundle support land. Do not add this to deployment.services[].
sandbox:
  artifact:
    name: sandbox
    context: services/sandbox
    dockerfile: services/sandbox/Dockerfile
  port: 44772
  secret_refs:
    - key: SANDBOX_EXECD_TOKEN
  resources:
    cpu_units: 1
    memory_mi: 1024
    storage_mi: 5120
